name: Update ApocalyptiClock

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-clock:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Random jitter delay (avoids GitHub's scheduled-workflow thundering herd hitting GDELT at once)
        run: sleep $(( RANDOM % 240 ))

      - name: Run the update (rotates one category, calls Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 update_clock.py

      - name: Commit updated data back to the repo
        run: |
          git config --global user.name "apocalypticlock-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add public/clock-data.json
          git diff --quiet --cached || git commit -m "Hourly update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
