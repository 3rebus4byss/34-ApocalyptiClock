name: Update ApocalyptiClock

on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour -- runs on GitHub's servers,
                            # completely independent of whether your local machine is on
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab
    inputs:
      category:
        description: 'Category to test (leave as "auto" for normal rotation)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - nuclear
          - conflict
          - climate
          - biosecurity
          - ai_risk
          - human_factors

permissions:
  contents: write   # needed to commit the updated clock-data.json back to the repo
  pages: write       # needed to publish to GitHub Pages
  id-token: write    # required by GitHub Pages' deployment action

concurrency:
  group: update-clock
  cancel-in-progress: false   # let the current run finish rather than killing it mid-push

jobs:
  update-clock:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Random jitter delay (skipped for manual category tests; avoids GitHub's
          scheduled-workflow thundering herd hitting GDELT at once on real hourly runs)
        if: ${{ github.event.inputs.category == '' || github.event.inputs.category == 'auto' }}
        run: sleep $(( RANDOM % 240 ))

      - name: Run the update (rotates one category, calls Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDELT_CLOUD_API_KEY: ${{ secrets.GDELT_CLOUD_API_KEY }}
          CATEGORY_OVERRIDE: ${{ github.event.inputs.category == 'auto' && '' || github.event.inputs.category }}
        run: python3 update_clock.py

      - name: Commit and push updated data (retries on push races)
        run: |
          set +e   # don't let GitHub Actions' default errexit kill the loop on the first failure
          git config --global user.name "apocalypticlock-bot"
          git config --global user.email "bot@users.noreply.github.com"

          success=0
          for attempt in 1 2 3 4 5; do
            git add public/clock-data.json
            git diff --cached --quiet
            if [ $? -eq 0 ]; then
              echo "No changes to commit."
              success=1
              break
            fi

            git commit -m "Hourly update: $(date -u +'%Y-%m-%d %H:%M UTC')"

            git push
            if [ $? -eq 0 ]; then
              echo "Pushed successfully on attempt $attempt."
              success=1
              break
            fi

            echo "Push rejected (attempt $attempt/5) -- someone else pushed in the meantime. Pulling and retrying..."

            git fetch origin main
            if [ $? -ne 0 ]; then
              echo "git fetch failed, waiting and retrying..."
              sleep $(( RANDOM % 10 + 5 ))
              continue
            fi

            # This bot only ever touches clock-data.json, and its freshly
            # computed version is always the most current -- so on any
            # conflict, keep the bot's version rather than trying to merge.
            git merge -X ours origin/main -m "Merge: keep bot's clock-data.json (auto-resolved race)"
            if [ $? -ne 0 ]; then
              echo "Merge failed -- aborting merge and forcing a clean reapply of the bot's commit on top of origin/main."
              git merge --abort 2>/dev/null
              git reset --soft origin/main
              git add public/clock-data.json
              git diff --cached --quiet || git commit -m "Hourly update: $(date -u +'%Y-%m-%d %H:%M UTC') (recovered)"
            fi

            sleep $(( RANDOM % 10 + 5 ))
          done

          if [ "$success" -ne 1 ]; then
            echo "::error::Failed to push after 5 attempts."
            exit 1
          fi

      - name: Upload site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
