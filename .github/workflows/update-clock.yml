name: Update ApocalyptiClock

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  update-clock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Random jitter delay (avoids GitHub's scheduled-workflow thundering herd hitting GDELT at once)
        run: sleep $(( RANDOM % 240 ))

      - name: Run the update (rotates one category, calls Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 update_clock.py

      - name: Commit updated data back to the repo
        run: |
          git config --global user.name "apocalypticlock-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add public/clock-data.json
          git diff --quiet --cached || git commit -m "Hourly update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Set up Node (for Netlify CLI)
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy public/ directly to Netlify (bypasses Netlify's own build system --
          avoids burning build minutes on every hourly commit)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: netlify deploy --prod --dir=public --auth="$NETLIFY_AUTH_TOKEN" --site="$NETLIFY_SITE_ID"
