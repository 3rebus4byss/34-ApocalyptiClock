name: Update ApocalyptiClock

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-clock
  cancel-in-progress: false

jobs:
  update-clock:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Random jitter delay (avoids GitHub's scheduled-workflow thundering herd hitting GDELT at once)
        run: sleep $(( RANDOM % 240 ))

      - name: Run the update (rotates one category, calls Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 update_clock.py

      - name: Commit and push updated data (retries on push races)
        run: |
          git config --global user.name "apocalypticlock-bot"
          git config --global user.email "bot@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git add public/clock-data.json
            if git diff --cached --quiet; then
              echo "No changes to commit."
              break
            fi
            git commit -m "Hourly update: $(date -u +'%Y-%m-%d %H:%M UTC')"

            if git push; then
              echo "Pushed successfully on attempt $attempt."
              break
            fi

            echo "Push rejected (attempt $attempt/5) -- someone else pushed in the meantime. Pulling and retrying..."
            git fetch origin main
            git merge -X ours origin/main -m "Merge: keep bot's clock-data.json (auto-resolved race)"
            sleep $(( RANDOM % 10 + 5 ))
          done

      - name: Upload site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
