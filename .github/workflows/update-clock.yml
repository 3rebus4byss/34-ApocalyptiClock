name: Update ApocalyptiClock

on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour -- one category rotates through per run
  workflow_dispatch: {}       # allows manual runs from the Actions tab

jobs:
  update-clock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_clock.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "clock-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add clock-data.json
          git diff --quiet --cached || git commit -m "Hourly update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
